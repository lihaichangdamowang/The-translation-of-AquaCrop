name: Import AquaCrop Chinese HTML
on:
  push:
    branches: [main]
    paths: ['.upload/aquacrop/**']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify full HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          folder = Path('.upload/aquacrop')
          parts = [folder / ('part%03d' % i) for i in range(7)]
          data = b''.join(p.read_bytes() for p in parts)
          expected = 'caadc9b79f9f97b0740c2af99dcb4c8e983a62559a9415216df27621436e1a58'
          assert hashlib.sha256(data).hexdigest() == expected, 'HTML checksum mismatch'
          assert len(data) == 55262997, 'HTML size mismatch'
          Path('AquaCrop73-Chapter3-zh-CN.html').write_bytes(data)
          for part in parts:
              part.unlink()
          folder.rmdir()
          print('Verified complete Chinese translation:', len(data), 'bytes')
          PY
      - name: Commit complete Chinese translation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "上传 AquaCrop 第三章中译版完整 HTML"
          git push origin HEAD:main
